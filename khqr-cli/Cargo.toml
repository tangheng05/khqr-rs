[package]
name = "khqr-cli"
description = "Command line tool for generating, decoding and watching KHQR payments"
keywords = ["khqr", "bakong", "cambodia", "cli", "qr"]
categories = ["command-line-utilities"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "khqr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.61", features = ["derive", "env"] }
khqr-api.workspace = true
khqr-core = { workspace = true, features = ["image"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
