[package]
name = "khqr-core"
description = "TLV codec, CRC16 and payload builder for Cambodia's KHQR (Bakong) payment QR standard"
keywords = ["khqr", "bakong", "emvco", "qr", "cambodia"]
categories = ["encoding", "no-std"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
image = { version = "0.25.6", default-features = false, features = ["png"], optional = true }
md-5 = { version = "0.10.6", default-features = false }
qrcode = { version = "0.14.1", default-features = false, optional = true, features = ["svg"] }

[features]
default = ["std"]
std = []
image = ["std", "dep:qrcode", "dep:image"]
